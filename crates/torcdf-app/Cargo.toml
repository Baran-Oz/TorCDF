[package]
name = "torcdf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "torcdf"
path = "src/main.rs"

[dependencies]
bytemuck = "1"
rayon = "1"
eframe = "0.37"
# egui_plot 0.38 and egui_extras 0.37 both build on egui 0.37 (eframe 0.37's).
egui_extras = { version = "0.37", default-features = false }
egui_plot = "0.38"
rfd = { version = "0.18", default-features = false }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
torcdf-core = { path = "../torcdf-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Registry"] }

[dev-dependencies]
torcdf-core = { path = "../torcdf-core", features = ["fixtures"] }
tempfile = "3"
pollster = "1"
approx = "0.5"

[build-dependencies]
winresource = "0.1"
