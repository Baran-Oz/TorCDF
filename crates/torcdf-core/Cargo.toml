[package]
name = "torcdf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Exposes netCDF fixture writers for tests (this crate's and dependents').
fixtures = []

[dependencies]
crossbeam-channel = "0.5.17"
hdf5-metno-sys = "0.12"
libdeflater = "1"
lru = "0.19.1"
netcdf = { version = "0.12", features = ["static"] }
netcdf-sys = "0.9"
rayon = "1.12"
sysinfo = "0.40.4"
thiserror = "2"

[dev-dependencies]
torcdf-core = { path = ".", features = ["fixtures"] }
tempfile = "3"
approx = "0.5"
