# cargo-about configuration: the Rust-crate part of THIRD_PARTY_LICENSES.txt.
# Only licences compatible with GPL-3.0-or-later are accepted; anything else fails the build.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    # Fonts bundled by egui (separate data, not linked code).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates (publish = false) are GPL-3.0-or-later and not third-party.
private = { ignore = true }

# hdf5-metno-src declares "(HDF5)", which is not an SPDX id. HDF5's licence is a BSD-3-Clause-style
# permissive licence; its full text is also in c-libraries-licences.txt.
[hdf5-metno-src.clarify]
license = "BSD-3-Clause"
[[hdf5-metno-src.clarify.files]]
path = "ext/hdf5/LICENSE"
license = "BSD-3-Clause"
checksum = "b384492d25c6e4a49f371b646d9a81bc0a4b97cf0c66c2f3ed1b35f78a148732"

# netcdf-src has no licence field; netCDF-C is BSD-3-Clause (source/COPYRIGHT).
[netcdf-src.clarify]
license = "BSD-3-Clause"
[[netcdf-src.clarify.files]]
path = "source/COPYRIGHT"
license = "BSD-3-Clause"
checksum = "d3b81bcbe2b4fd7057e7bc603f58dd0c855c5c9b5635966d2c22d9a13f384fb8"
