name: Release

# A tag vX.Y.Z builds, tests and publishes a GitHub Release.
# Run it by hand (workflow_dispatch) for a dry run: everything is built and kept as an artifact,
# nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:\t
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Absolute target dir: rust-cache's `workspaces` joins paths and would miss C:\t.
          cache-directories: C:\t
          shared-key: release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Version
        id: version
        shell: powershell
        run: |
          $v = (.\installer\check-version.ps1 | Out-String).Trim()
          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            .\installer\check-version.ps1 -Tag $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Tests
        run: cargo test --workspace
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: |
          .\installer\build.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smoke-test the installer
        shell: powershell
        run: |
          .\installer\smoke.ps1 -Setup "installer\Output\TorCDF-${{ steps.version.outputs.version }}-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Stage release files and checksums
        shell: powershell
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "installer\Output\TorCDF-$v-setup.exe" dist\
          Copy-Item "installer\Output\TorCDF-$v-setup.exe" dist\TorCDF-setup.exe
          Copy-Item "$env:CARGO_TARGET_DIR\release\torcdf.exe" dist\
          Copy-Item installer\install.ps1 dist\
          $lines = Get-ChildItem dist | Sort-Object Name | ForEach-Object {
            (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() + '  ' + $_.Name
          }
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: torcdf-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: torcdf-${{ needs.build.outputs.version }}
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # If a release for this tag was already made on the website, attach the files to it instead.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "TorCDF ${{ needs.build.outputs.version }}" --notes-from-tag
          fi

  winget:
    needs: publish
    runs-on: windows-latest
    env:
      # A classic personal access token (public_repo) added by the owner as a repository secret.
      # Without it this job does nothing; the first winget submission is made by hand.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Open the winget update pull request
        if: env.WINGET_TOKEN != ''
        # Pinned to the v2 release commit: this action is given a token that can push to the owner's repos.
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: Baran-Oz.TorCDF
          installers-regex: 'TorCDF-[0-9.]+-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
